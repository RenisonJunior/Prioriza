spring.application.name=prioriza-testes
# Identifica a configuracao utilizada nos testes.

spring.datasource.url=jdbc:h2:mem:prioriza_testes;DB_CLOSE_DELAY=-1
# Usa um banco temporario em memoria.

spring.datasource.username=sa
# Define o usuario do banco de testes.

spring.datasource.password=
# Define a senha vazia para o banco temporario.

spring.jpa.hibernate.ddl-auto=create-drop
# Cria as tabelas para o teste e remove ao encerrar o contexto.

spring.h2.console.enabled=false
# Mantem o console administrativo desativado.