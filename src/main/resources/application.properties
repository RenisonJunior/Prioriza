spring.application.name=prioriza
# Define o nome da aplicacao.

server.port=8080
# Define a porta utilizada pelo servidor web.

server.forward-headers-strategy=framework
# Considera os dados de encaminhamento do proxy do Codespaces.

spring.datasource.url=jdbc:h2:file:./dados/prioriza
# Salva o banco em arquivos dentro da pasta dados.

spring.datasource.username=sa
# Define o usuario de acesso ao banco local.

spring.datasource.password=
# Mantem a senha do banco local vazia nesta configuracao didatica.

spring.jpa.hibernate.ddl-auto=update
# Cria as tabelas ausentes e atualiza a estrutura conforme as entidades.

spring.h2.console.enabled=false
# Mantem o console administrativo do banco desativado.

spring.thymeleaf.cache=false
# Facilita visualizar alteracoes nas paginas durante o desenvolvimento.