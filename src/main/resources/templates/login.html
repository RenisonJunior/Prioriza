<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Prioriza</title>
</head>
<body>
    <main>
        <h1>Prioriza</h1>
        <p>Organize sua rotina, um passo de cada vez.</p>

        <p th:if="${param.erro}">E-mail ou senha incorretos.</p>
        <p th:if="${param.cadastro}">Cadastro concluído. Entre na sua conta.</p>
        <p th:if="${param.saiu}">Você saiu da sua conta.</p>

        <form th:action="@{/login}" method="post">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required>

            <button type="submit">Entrar</button>
        </form>

        <p>Primeira vez aqui? <a th:href="@{/cadastro}">Criar conta</a></p>
    </main>
</body>
</html>touch src/main/resources/templates/cadastro.html
